<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>jpmap_terrain – 距離計測デモ</title>
  <meta name="description" content="jpmap_terrain の距離計測デモ (#186)。クリックで点を追加し、辺ごとに水平距離・高低差を表示する">
  <meta name="author" content="8ga3">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      /* Meta Quest Browser等、A/Xボタン押下＋コントローラー移動をマウスの
         「押下＋ドラッグ」として合成する環境や、Ctrl+A（Cmd+A）で、ページ上の
         テキストが意図せず選択されてしまう。3DCGビューアであり選択可能な
         テキストを提供する必要がないため、ページ全体で無効化する。 */
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 操作 UI ルート。ポインターイベントは透過。 */
    #distance-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }

    #distance-overlay .back-link {
      position: absolute;
      top: 12px;
      left: 12px;
      pointer-events: auto;
      padding: 6px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      text-decoration: none;
    }

    #distance-overlay .back-link:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    #distance-controls {
      position: absolute;
      top: 12px;
      right: 64px;
      pointer-events: auto;
      padding: 10px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 260px;
    }

    #distance-controls strong {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #c8d2e6;
    }

    #distance-toolbar-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #distance-controls button {
      pointer-events: auto;
      padding: 4px 10px;
      font-size: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    #distance-controls button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* 選択中モードを強調 (data-active="true")。 */
    #distance-controls button[data-active="true"] {
      background: rgba(96, 165, 250, 0.55);
      border-color: rgba(191, 219, 254, 0.85);
    }

    #distance-controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #distance-controls button:disabled:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    #distance-status {
      font-size: 11px;
      line-height: 1.4;
      color: #e2e8f0;
      white-space: pre-line;
    }

    /* モバイル用の操作パネル開閉トグル（PC では非表示・パネル常時表示）。 */
    .panel-toggle-cb,
    .panel-toggle-btn {
      display: none;
    }

    @media (max-width: 640px) {
      .panel-toggle-btn {
        position: absolute;
        top: 56px;
        left: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        pointer-events: auto;
        color: #fff;
        font-size: 18px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        cursor: pointer;
        z-index: 11;
      }

      #distance-panel-toggle:checked + .panel-toggle-btn {
        background: rgba(96, 165, 250, 0.55);
        border-color: rgba(191, 219, 254, 0.85);
      }

      #distance-controls {
        top: 104px;
        left: 8px;
        right: auto;
        width: min(78vw, 280px);
        min-width: 0;
        max-width: none;
        max-height: calc(100vh - 160px);
        overflow-y: auto;
        font-size: 13px;
      }

      /* 既定は折り畳み（閉じた状態）。トグルで開く。 */
      #distance-panel-toggle:not(:checked) ~ #distance-controls {
        display: none;
      }

      #distance-controls button {
        min-height: 36px;
        padding: 8px 12px;
        font-size: 14px;
      }

      #distance-overlay .back-link {
        padding: 8px 14px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="distance-overlay">
    <a class="back-link" href="/">← デモ一覧へ</a>
    <input type="checkbox" id="distance-panel-toggle" class="panel-toggle-cb" hidden>
    <label for="distance-panel-toggle" class="panel-toggle-btn" aria-label="操作パネルの開閉" title="操作パネル">⚙</label>
    <div id="distance-controls">
      <strong>距離計測デモ</strong>
      <div id="distance-toolbar-buttons"></div>
      <div id="distance-status"></div>
    </div>
  </div>
    <script type="module" src="/src/demos/distance/index.ts"></script>
  </body>
</html>
