<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>jpmap_terrain – 距離計測デモ</title>
  <meta name="description" content="jpmap_terrain の距離計測デモ (#186)。クリックで点を追加し、辺ごとに水平距離・高低差を表示する">
  <meta name="author" content="8ga3">
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 操作 UI ルート。ポインターイベントは透過。 */
    #distance-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }

    #distance-overlay .back-link {
      position: absolute;
      top: 12px;
      left: 12px;
      pointer-events: auto;
      padding: 6px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      text-decoration: none;
    }

    #distance-overlay .back-link:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    #distance-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      pointer-events: auto;
      padding: 10px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 260px;
    }

    #distance-controls strong {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #c8d2e6;
    }

    #distance-toolbar-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #distance-controls button {
      pointer-events: auto;
      padding: 4px 10px;
      font-size: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
    }

    #distance-controls button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* 選択中モードを強調 (data-active="true")。 */
    #distance-controls button[data-active="true"] {
      background: rgba(96, 165, 250, 0.55);
      border-color: rgba(191, 219, 254, 0.85);
    }

    #distance-status {
      font-size: 11px;
      line-height: 1.4;
      color: #e2e8f0;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="distance-overlay">
    <a class="back-link" href="/">← デモ一覧へ</a>
    <div id="distance-controls">
      <strong>距離計測デモ (#186)</strong>
      <div id="distance-toolbar-buttons"></div>
      <div id="distance-status"></div>
    </div>
  </div>
</body>
</html>
