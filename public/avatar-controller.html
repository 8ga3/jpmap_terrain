<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>jpmap_terrain – アバターアニメーション #02</title>
  <meta name="description" content="キーボード / Gamepad / Virtual Joystick でアバターを操作するデモ">
  <meta name="author" content="8ga3">
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #avatar-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }

    #avatar-overlay .back-link {
      position: absolute;
      top: 12px;
      left: 12px;
      pointer-events: auto;
      padding: 6px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      text-decoration: none;
    }

    #avatar-overlay .back-link:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    #avatar-controls {
      position: absolute;
      top: 12px;
      right: 64px;
      pointer-events: auto;
      padding: 12px 14px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 220px;
    }

    #avatar-controls strong {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #e8ecf2;
    }

    #avatar-controls .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    #avatar-controls .info-row .label {
      color: #e0e4ea;
    }

    #avatar-controls .info-row .value {
      font-family: "SF Mono", "Fira Code", monospace;
    }

    #avatar-controls input[type="range"] {
      width: 100%;
      margin: 4px 0;
    }

    #avatar-controls button {
      pointer-events: auto;
      padding: 6px 10px;
      font-size: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
    }

    #avatar-controls button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    #avatar-controls .hint {
      font-size: 10px;
      color: #c8cdd6;
      margin-top: 4px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="avatar-overlay">
    <a class="back-link" href="/">← デモ一覧へ</a>
    <div id="avatar-controls">
      <strong>アバターアニメーション #02</strong>
      <div class="info-row">
        <span class="label">緯度</span>
        <span class="value" id="avatar-lat">-</span>
      </div>
      <div class="info-row">
        <span class="label">経度</span>
        <span class="value" id="avatar-lon">-</span>
      </div>
      <div>
        <div class="info-row">
          <label for="speed-slider" style="font-size: 11px; color: #e0e4ea;">速度 (m/s)</label>
          <span class="value" id="speed-value">10</span>
        </div>
        <input type="range" id="speed-slider" min="1" max="50" value="10" step="1">
      </div>
      <button id="fly-to-avatar">アバターへカメラ移動</button>
      <div class="info-row" style="align-items: center;">
        <label for="auto-scroll-toggle" style="font-size: 11px; color: #e0e4ea;">自動スクロール</label>
        <input type="checkbox" id="auto-scroll-toggle" checked>
      </div>
      <div class="hint">
        操作: 矢印キー / WASD / Gamepad 左スティック / Virtual Joystick<br>
        地面クリックでアバターの位置を変更します
      </div>
    </div>
  </div>
</body>
</html>
