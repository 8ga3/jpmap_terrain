<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>jpmap_terrain – Artillery Game</title>
  <meta name="description" content="ターン制対戦 Artillery Game デモ">
  <meta name="author" content="8ga3">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #artillery-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }

    /* Back link */
    #artillery-overlay .back-link {
      position: absolute;
      top: 8px;
      left: 8px;
      pointer-events: auto;
      padding: 4px 10px;
      font-size: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      text-decoration: none;
    }

    #artillery-overlay .back-link:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    /* Score bar — top center */
    .score-bar {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
    }

    .score-bar .team {
      padding: 3px 10px;
      border-radius: 4px;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .score-bar .team-red { color: #ff6b6b; }
    .score-bar .team-blue { color: #74b9ff; }

    .score-bar .team-red.active {
      background: rgba(220, 50, 50, 0.35);
      box-shadow: 0 0 6px rgba(255, 80, 80, 0.5);
    }

    .score-bar .team-blue.active {
      background: rgba(50, 100, 220, 0.35);
      box-shadow: 0 0 6px rgba(100, 150, 255, 0.5);
    }

    .score-bar .separator {
      margin: 0 4px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
    }

    /* Controls — bottom center（スケールバーと重ならないよう少し上に配置 #259） */
    .controls-bar {
      position: absolute;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 6px 12px;
      color: #fff;
      font-size: 11px;
    }

    .controls-bar .ctrl-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .controls-bar label {
      font-size: 10px;
      color: #ccc;
      white-space: nowrap;
    }

    .controls-bar input[type="range"] {
      width: 80px;
      height: 14px;
    }

    .controls-bar .ctrl-value {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11px;
      min-width: 28px;
      text-align: right;
    }

    .controls-bar button {
      pointer-events: auto;
      padding: 5px 10px;
      font-size: 11px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .controls-bar button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .controls-bar button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .controls-bar button:disabled:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .controls-bar button.fire-btn {
      background: rgba(220, 50, 50, 0.6);
      border-color: rgba(255, 100, 100, 0.5);
      font-weight: bold;
      font-size: 12px;
      padding: 5px 14px;
    }

    .controls-bar button.fire-btn:hover {
      background: rgba(220, 50, 50, 0.8);
    }

    .controls-bar button.fire-btn:disabled:hover {
      background: rgba(220, 50, 50, 0.6);
    }

    .controls-bar .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.2);
    }

    /* Center turn announce — フェードインで現れ、消えるときはブラー＋拡大で爆散する (#259) */
    .turn-announce {
      position: absolute;
      top: 44%;
      left: 50%;
      pointer-events: none;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -50%) scale(0.7);
      filter: blur(8px);
      will-change: opacity, transform, filter;
    }

    .turn-announce .announce-stage {
      font-size: clamp(40px, 8vw, 88px);
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #fff;
      line-height: 1.05;
      text-shadow:
        0 0 24px rgba(255, 255, 255, 0.65),
        0 6px 18px rgba(0, 0, 0, 0.85);
    }

    .turn-announce .announce-turn {
      margin-top: 10px;
      font-size: clamp(24px, 4.5vw, 46px);
      font-weight: 800;
      letter-spacing: 0.22em;
      line-height: 1.1;
      text-shadow:
        0 0 18px currentColor,
        0 4px 12px rgba(0, 0, 0, 0.85);
    }

    .turn-announce.team-red .announce-turn { color: #ff5b5b; }
    .turn-announce.team-blue .announce-turn { color: #66a3ff; }

    /* stage 名を持たない（ターン交代時）は stage 行を隠す */
    .turn-announce.no-stage .announce-stage { display: none; }

    /* フェードイン: 小さく・ぼやけた状態から原寸・くっきりへ */
    .turn-announce.in {
      visibility: visible;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      filter: blur(0px);
      transition:
        opacity 0.45s ease-out,
        transform 0.45s cubic-bezier(0.18, 0.9, 0.3, 1.35),
        filter 0.45s ease-out;
    }

    /* 退場: ブラーしながら爆発するように拡大して消える */
    .turn-announce.out {
      visibility: visible;
      opacity: 0;
      transform: translate(-50%, -50%) scale(2.7);
      filter: blur(26px);
      transition:
        opacity 0.6s ease-in,
        transform 0.6s ease-in,
        filter 0.6s ease-in;
    }

    @media (prefers-reduced-motion: reduce) {
      .turn-announce.in,
      .turn-announce.out {
        transition-duration: 0.001s;
      }
    }

    /* Center HIT banner — 命中時に派手に弾けて表示する (#259) */
    .hit-banner {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.2) rotate(-8deg);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      font-size: clamp(64px, 14vw, 168px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.04em;
      color: #fff35b;
      -webkit-text-stroke: 3px #c81e1e;
      text-shadow:
        0 0 18px rgba(255, 120, 0, 0.95),
        0 0 42px rgba(255, 60, 0, 0.8),
        0 8px 22px rgba(0, 0, 0, 0.85);
      will-change: opacity, transform, filter;
    }

    /* 弾けて出現 → 少し落ち着く → ブラーしながら爆散して消える */
    .hit-banner.play {
      visibility: visible;
      animation: hit-pop 1s ease-out forwards;
    }

    @keyframes hit-pop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(-8deg);
        filter: blur(12px);
      }
      18% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.35) rotate(4deg);
        filter: blur(0px);
      }
      32% {
        transform: translate(-50%, -50%) scale(1) rotate(-2deg);
      }
      70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05) rotate(0deg);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.4) rotate(0deg);
        filter: blur(24px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hit-banner.play {
        animation-duration: 0.4s;
      }
    }

    /* Input blocker — 告知表示中は地図/ゲームへのマウス操作を全面遮断する (#259) */
    .input-blocker {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      pointer-events: none;
      cursor: default;
      touch-action: none;
      background: transparent;
    }
    .input-blocker.active {
      display: block;
      pointer-events: auto;
    }

    @media (max-width: 640px) {
      #artillery-overlay .back-link {
        padding: 8px 14px;
        font-size: 14px;
      }

      .score-bar {
        /* 上端左右の back-link / コンパスを避けて中央に収める。 */
        max-width: calc(100vw - 130px);
        box-sizing: border-box;
        font-size: 12px;
      }

      .score-bar .team {
        padding: 4px 6px;
      }

      .score-bar .separator {
        margin: 0 2px;
      }

      .controls-bar {
        /* 下端隅のズーム/写真ボタンへ被らないよう、ボタン群の上へ持ち上げる。 */
        bottom: 140px;
        width: calc(100vw - 16px);
        box-sizing: border-box;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        font-size: 12px;
      }

      .controls-bar .ctrl-group {
        flex: 1 1 130px;
        min-width: 0;
      }

      .controls-bar input[type="range"] {
        flex: 1;
        min-width: 80px;
        height: 28px;
      }

      .controls-bar .divider {
        display: none;
      }

      .controls-bar button {
        min-height: 36px;
        padding: 8px 12px;
        font-size: 14px;
      }

      .controls-bar button.fire-btn {
        padding: 8px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="artillery-overlay">
    <a class="back-link" href="/">← Back</a>

    <!-- Score — top center -->
    <div class="score-bar">
      <span class="team team-red active" id="turn-indicator-red">RED <span id="score-red">0</span></span>
      <span class="separator">–</span>
      <span class="team team-blue" id="turn-indicator-blue"><span id="score-blue">0</span> BLUE</span>
    </div>

    <!-- Center turn announce (#259) -->
    <div class="turn-announce" id="turn-announce">
      <div class="announce-stage" id="announce-stage">HAKONE</div>
      <div class="announce-turn" id="announce-turn">RED ATTACK</div>
    </div>

    <!-- Input blocker — 告知表示中は全マウス操作を遮断する (#259) -->
    <div class="input-blocker" id="input-blocker"></div>

    <!-- Center HIT banner (#259) -->
    <div class="hit-banner" id="hit-banner">HIT!</div>

    <!-- Controls — bottom center -->
    <div class="controls-bar">
      <div class="ctrl-group">
        <label for="angle-slider">Angle</label>
        <input type="range" id="angle-slider" min="5" max="85" value="45" step="1">
        <span class="ctrl-value" id="angle-value">45°</span>
      </div>
      <div class="divider"></div>
      <div class="ctrl-group">
        <label for="heading-slider">Heading</label>
        <input type="range" id="heading-slider" min="-45" max="45" value="0" step="1">
        <span class="ctrl-value" id="heading-value">0°</span>
      </div>
      <div class="divider"></div>
      <!-- ラベルは UI 省スペースのため "Power" と表記。内部的には powder（火薬量）。 -->
      <div class="ctrl-group">
        <label for="powder-slider">Power</label>
        <input type="range" id="powder-slider" min="1" max="100" value="50" step="1">
        <span class="ctrl-value" id="powder-value">50%</span>
      </div>
      <div class="divider"></div>
      <button class="fire-btn" id="fire-btn">FIRE</button>
      <button id="restart-btn" aria-label="Restart" title="Restart">↺</button>
    </div>
  </div>
    <script type="module" src="/src/demos/artillery/index.ts"></script>
  </body>
</html>
