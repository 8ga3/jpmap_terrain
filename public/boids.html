<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>jpmap_terrain – Boids フロッキングデモ</title>
  <meta name="description" content="Boidsアルゴリズムによる群衆シミュレーションデモ">
  <meta name="author" content="8ga3">
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #boids-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }

    #boids-overlay .back-link {
      position: absolute;
      top: 12px;
      left: 12px;
      pointer-events: auto;
      padding: 6px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      text-decoration: none;
    }

    #boids-overlay .back-link:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    #boids-controls {
      position: absolute;
      top: 12px;
      right: 64px;
      pointer-events: auto;
      padding: 12px 14px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
    }

    #boids-controls strong {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #e8ecf2;
    }

    #boids-controls .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    #boids-controls .info-row .label {
      color: #e0e4ea;
    }

    #boids-controls .info-row .value {
      font-family: "SF Mono", "Fira Code", monospace;
    }

    #boids-controls input[type="range"] {
      width: 100%;
      margin: 4px 0;
    }

    #boids-controls button {
      pointer-events: auto;
      padding: 6px 10px;
      font-size: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
    }

    #boids-controls button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-row {
      display: flex;
      gap: 6px;
    }

    .btn-row button {
      flex: 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boids-overlay">
    <a class="back-link" href="/">← デモ一覧へ</a>
    <div id="boids-controls">
      <strong>Boids フロッキングデモ</strong>
      <div class="info-row">
        <span class="label">リージョン中心</span>
        <span class="value" id="region-center">-</span>
      </div>
      <div>
        <div class="info-row">
          <label for="boid-count-slider" style="font-size: 11px; color: #e0e4ea;">アバター数</label>
          <span class="value" id="boid-count-value">20</span>
        </div>
        <input type="range" id="boid-count-slider" min="1" max="50" value="20" step="1">
      </div>
      <div class="btn-row">
        <button id="toggle-pause">⏸ 一時停止</button>
        <button id="restart-btn">🔄 リスタート</button>
      </div>
      <button id="fly-to-region">リージョン中心へ移動</button>
      <div style="font-size: 10px; color: #c8cdd6; margin-top: 4px;">
        アバターがBoids(群衆)ルールで自律移動します
      </div>
    </div>
  </div>
    <script type="module" src="/src/demos/boids/index.ts"></script>
  </body>
</html>
