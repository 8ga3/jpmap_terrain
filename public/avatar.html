<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>jpmap_terrain – アバターアニメーション #01</title>
  <meta name="description" content="3Dアバターが地形に沿って円軌道を移動するアニメーションデモ">
  <meta name="author" content="8ga3">
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #avatar-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }

    #avatar-overlay .back-link {
      position: absolute;
      top: 12px;
      left: 12px;
      pointer-events: auto;
      padding: 6px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      text-decoration: none;
    }

    #avatar-overlay .back-link:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    #avatar-controls {
      position: absolute;
      top: 12px;
      right: 64px;
      pointer-events: auto;
      padding: 12px 14px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
    }

    #avatar-controls strong {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #e8ecf2;
    }

    #avatar-controls .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    #avatar-controls .info-row .label {
      color: #e0e4ea;
    }

    #avatar-controls .info-row .value {
      font-family: "SF Mono", "Fira Code", monospace;
    }

    #avatar-controls input[type="range"] {
      width: 100%;
      margin: 4px 0;
    }

    #avatar-controls button {
      pointer-events: auto;
      padding: 6px 10px;
      font-size: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
    }

    #avatar-controls button:hover {
      background: rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="avatar-overlay">
    <a class="back-link" href="/">← デモ一覧へ</a>
    <div id="avatar-controls">
      <strong>アバターアニメーション #01</strong>
      <div class="info-row">
        <span class="label">中心緯度</span>
        <span class="value" id="center-lat">-</span>
      </div>
      <div class="info-row">
        <span class="label">中心経度</span>
        <span class="value" id="center-lon">-</span>
      </div>
      <div>
        <div class="info-row">
          <label for="radius-slider" style="font-size: 11px; color: #e0e4ea;">半径 (m)</label>
          <span class="value" id="radius-value">200</span>
        </div>
        <input type="range" id="radius-slider" min="50" max="1000" value="200" step="10">
      </div>
      <div>
        <div class="info-row">
          <label for="speed-slider" style="font-size: 11px; color: #e0e4ea;">速度 (°/s)</label>
          <span class="value" id="speed-value">20</span>
        </div>
        <input type="range" id="speed-slider" min="1" max="90" value="20" step="1">
      </div>
      <button id="toggle-animation">⏸ 停止</button>
      <button id="fly-to-center">中心位置へ移動</button>
      <div style="font-size: 10px; color: #c8cdd6; margin-top: 4px;">
        地面をクリックすると円軌道の中心が移動します
      </div>
    </div>
  </div>
    <script type="module" src="/src/demos/avatar/index.ts"></script>
  </body>
</html>
