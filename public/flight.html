<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>jpmap_terrain – フライトデモ</title>
  <meta name="description" content="飛行機が上空を旋回し、FollowCameraで追跡するデモ">
  <meta name="author" content="8ga3">
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #flight-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }

    #flight-overlay .back-link {
      position: absolute;
      top: 12px;
      left: 12px;
      pointer-events: auto;
      padding: 6px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      text-decoration: none;
    }

    #flight-overlay .back-link:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    #flight-controls {
      position: absolute;
      top: 12px;
      right: 64px;
      pointer-events: auto;
      padding: 12px 14px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
    }

    #flight-controls strong {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #e8ecf2;
    }

    #flight-controls .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    #flight-controls .info-row .label {
      color: #e0e4ea;
    }

    #flight-controls .info-row .value {
      font-family: "SF Mono", "Fira Code", monospace;
    }

    #flight-controls input[type="range"] {
      width: 100%;
      margin: 4px 0;
    }

    #flight-controls button {
      pointer-events: auto;
      padding: 6px 10px;
      font-size: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
    }

    #flight-controls button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    #flight-controls button.active {
      background: rgba(59, 130, 246, 0.5);
      border-color: rgba(59, 130, 246, 0.8);
    }

    #flight-controls .camera-buttons {
      display: flex;
      gap: 4px;
    }

    #flight-controls .camera-buttons button {
      flex: 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="flight-overlay">
    <a class="back-link" href="/">← デモ一覧へ</a>
    <div id="flight-controls">
      <strong>フライトデモ (Issue #245)</strong>
      <div class="info-row">
        <span class="label">中心緯度</span>
        <span class="value" id="center-lat">-</span>
      </div>
      <div class="info-row">
        <span class="label">中心経度</span>
        <span class="value" id="center-lon">-</span>
      </div>
      <div>
        <div class="info-row">
          <label for="radius-slider" style="font-size: 11px; color: #e0e4ea;">半径 (m)</label>
          <span class="value" id="radius-value">2000</span>
        </div>
        <input type="range" id="radius-slider" min="500" max="10000" value="2000" step="100">
      </div>
      <div>
        <div class="info-row">
          <label for="speed-slider" style="font-size: 11px; color: #e0e4ea;">速度 (m/s)</label>
          <span class="value" id="speed-value">100</span>
        </div>
        <input type="range" id="speed-slider" min="100" max="340" value="100" step="10">
      </div>
      <div>
        <div class="info-row">
          <label for="altitude-slider" style="font-size: 11px; color: #e0e4ea;">高度 (m)</label>
          <span class="value" id="altitude-value">500</span>
        </div>
        <input type="range" id="altitude-slider" min="100" max="10000" value="500" step="50">
      </div>
      <button id="toggle-animation">⏸ 停止</button>
      <button id="fly-to-center">中心位置へ移動</button>
      <div style="font-size: 11px; color: #e0e4ea; margin-top: 4px;">カメラモード</div>
      <div class="camera-buttons">
        <button id="camera-3d" class="active">3D</button>
        <button id="camera-2d">2D</button>
        <button id="camera-follow">Follow</button>
      </div>
      <div id="follow-cam-info" style="display:none; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 6px; margin-top: 2px;">
        <div style="font-size: 11px; color: #e0e4ea; margin-bottom: 4px;">Follow カメラ</div>
        <div class="info-row">
          <span class="label">距離 (m)</span>
          <span class="value" id="follow-radius-value">-</span>
        </div>
        <div class="info-row">
          <span class="label">高度 Offset (m)</span>
          <span class="value" id="follow-height-value">-</span>
        </div>
        <div class="info-row" style="margin-top: 4px;">
          <span class="label">タイル粒度↓ (LOD bias)</span>
          <span class="value" id="follow-lod-bias-value">0</span>
        </div>
        <input type="range" id="follow-lod-bias" min="0" max="4" step="1" value="0" style="width: 100%; margin-top: 2px;" />
        <div style="font-size: 10px; color: #c8cdd6; margin-top: 4px;">ドラッグ左右: 回転 / 上下: 高度 / ホイール: 距離</div>
      </div>
      <div style="font-size: 10px; color: #c8cdd6; margin-top: 4px;">
        地面をクリックすると円軌道の中心が移動します
      </div>
    </div>
  </div>
</body>
</html>
