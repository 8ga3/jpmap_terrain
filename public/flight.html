<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>jpmap_terrain – フライトデモ</title>
  <meta name="description" content="飛行機が上空を旋回し、FollowCameraで追跡するデモ">
  <meta name="author" content="8ga3">
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #flight-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    }

    #flight-overlay .back-link {
      position: absolute;
      top: 12px;
      left: 12px;
      pointer-events: auto;
      padding: 6px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      text-decoration: none;
    }

    #flight-overlay .back-link:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    #flight-controls {
      position: absolute;
      top: 12px;
      right: 64px;
      pointer-events: auto;
      padding: 10px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 200px;
    }

    #flight-controls .btn-row {
      display: flex;
      gap: 4px;
    }

    #flight-controls .btn-row button {
      flex: 1;
    }

    #flight-controls .inline-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 12px;
    }

    #flight-controls .inline-row .label {
      color: #e0e4ea;
    }

    #flight-controls .inline-row .value {
      font-family: "SF Mono", "Fira Code", monospace;
    }

    #flight-controls strong {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #e8ecf2;
    }

    #flight-controls .info-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 12px;
    }

    #flight-controls .info-row .label {
      color: #e0e4ea;
    }

    #flight-controls .info-row .value {
      font-family: "SF Mono", "Fira Code", monospace;
    }

    #flight-controls input[type="range"] {
      width: 100%;
      margin: 4px 0;
    }

    #flight-controls button {
      pointer-events: auto;
      padding: 6px 10px;
      font-size: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
    }

    #flight-controls button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    #flight-controls button.active {
      background: rgba(59, 130, 246, 0.5);
      border-color: rgba(59, 130, 246, 0.8);
    }

    #flight-controls .camera-buttons {
      display: flex;
      gap: 4px;
    }

    #flight-controls .camera-buttons button {
      flex: 1;
    }

    /* PIP overlay */
    #pip-frame {
      position: absolute;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 4px;
      pointer-events: auto;
      box-sizing: border-box;
      bottom: 12px;
      left: 12px;
      width: 20%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #000;
    }

    #pip-mount {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #pip-resize-handle {
      position: absolute;
      top: 0;
      right: 0;
      width: 24px;
      height: 24px;
      cursor: ne-resize;
      z-index: 1001;
      border-radius: 0 0 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.20);
      transition: background 0.2s ease;
      touch-action: none;
      user-select: none;
    }

    #pip-resize-handle::after {
      content: '⤡';
      font-size: 32px;
      color: rgba(255, 255, 255, 0.7);
      transform: scaleX(-1) translate(-1px, -3px);
      line-height: 1;
    }

    #pip-resize-handle:hover {
      background: rgba(33, 150, 243, 0.7);
    }

    #pip-label {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="flight-overlay">
    <a class="back-link" href="/">← デモ一覧へ</a>
    <div id="flight-controls">
      <strong>フライトデモ</strong>
      <div class="inline-row">
        <span class="label">緯度</span><span class="value" id="center-lat">-</span>
        <span class="label">経度</span><span class="value" id="center-lon">-</span>
      </div>
      <div>
        <div class="info-row">
          <label for="radius-slider" style="font-size: 11px; color: #e0e4ea;">半径 (m)</label>
          <span class="value" id="radius-value">2000</span>
        </div>
        <input type="range" id="radius-slider" min="500" max="10000" value="2000" step="100">
      </div>
      <div>
        <div class="info-row">
          <label for="speed-slider" style="font-size: 11px; color: #e0e4ea;">速度 (m/s)</label>
          <span class="value" id="speed-value">100</span>
        </div>
        <input type="range" id="speed-slider" min="100" max="340" value="100" step="10">
      </div>
      <div>
        <div class="info-row">
          <label for="altitude-slider" style="font-size: 11px; color: #e0e4ea;">高度 (m)</label>
          <span class="value" id="altitude-value">500</span>
        </div>
        <input type="range" id="altitude-slider" min="100" max="10000" value="500" step="50">
      </div>
      <div class="btn-row">
        <button id="toggle-animation">⏸ 停止</button>
        <button id="fly-to-center">移動</button>
      </div>
      <div style="font-size: 11px; color: #e0e4ea;">カメラモード</div>
      <div class="camera-buttons">
        <button id="camera-3d" class="active">3D</button>
        <button id="camera-2d">2D</button>
        <button id="camera-follow">Follow</button>
      </div>
      <div id="follow-cam-info" style="display:none; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 6px; margin-top: 2px;">
        <div class="inline-row" style="margin-bottom: 4px;">
          <span class="label">距離</span><span class="value" id="follow-radius-value">-</span>
          <span class="label">高度Offset</span><span class="value" id="follow-height-value">-</span>
        </div>
        <div class="info-row">
          <span class="label">タイル粒度↓ (LOD bias)</span>
          <span class="value" id="follow-lod-bias-value">0</span>
        </div>
        <input type="range" id="follow-lod-bias" min="0" max="4" step="1" value="0" aria-label="Follow モード LOD bias" style="width: 100%; margin-top: 2px;" />
        <div style="font-size: 10px; color: #c8cdd6; margin-top: 4px;">ドラッグ左右: 回転 / 上下: 高度 / ホイール: 距離</div>
      </div>
      <div style="font-size: 10px; color: #c8cdd6; margin-top: 2px;">
        地面クリックで円軌道の中心を移動
      </div>
      <div style="border-top: 1px solid rgba(255,255,255,0.15); padding-top: 6px; margin-top: 2px; display: flex; flex-direction: column; gap: 4px;">
        <strong style="font-size: 11px;">表示切替</strong>
        <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer;">
          <input type="checkbox" id="waypoint-toggle" checked style="cursor: pointer;">
          ウェイポイント
        </label>
        <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer;">
          <input type="checkbox" id="ribbon-toggle" checked style="cursor: pointer;">
          リボン (飛行経路)
        </label>
      </div>
    </div>
    <div id="pip-frame">
      <div id="pip-mount"></div>
      <span id="pip-label">機体カメラ</span>
      <div id="pip-resize-handle" title="サイズ変更" aria-label="サイズ変更"></div>
    </div>
  </div>
</body>
</html>
