name: Visuals guard

# 描画結果に影響し得る依存（`@babylonjs/*` / Playwright）を更新する PR で、
# ローカルでの `npm run test:visuals` 実施記録（PR 本文のチェックボックス）を強制する。
# スナップショット画像は地図データの利用規約違反に当たる可能性があるためコミットしておらず、
# 公開リポジトリの CI では比較基準を持てないため、比較自体はローカルで行う。
# PR 本文の編集でも再判定する必要があるが、ci.yml に `edited` を足すと本文を
# 編集するたびに全工程が再実行されるため、専用の workflow に分けている。
# `paths` で絞り込むとスキップされた PR のチェックが Pending のまま残り、必須チェックに
# 設定した場合に package-lock.json を変更しない PR がマージ不能になる。そのため全 PR で起動し、
# 対象依存の差分が無い場合はスクリプト側で成功させる。
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: visuals-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # 比較対象の base（マージコミットの第1親）を参照するため、親コミットまで取得する。
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      # チェックスクリプトは Node 組み込みモジュールのみを使うため npm ci は不要。
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'

      # pull_request イベントで checkout されるのは base と PR head のマージコミットで、
      # その第1親がマージ計算時点の base になる。実行時点の base ブランチ先端を取得すると、
      # 待機中に別 PR がマージされた場合に異なる時点の lockfile 同士を比較してしまうため、
      # checkout した内容と同じ時点の base を比較対象に固定する。
      - name: Extract base lockfile
        run: |
          if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "[visuals-guard] checked out commit is not a pull request merge commit" >&2
            exit 1
          fi
          git show HEAD^1:package-lock.json > "${RUNNER_TEMP}/base-package-lock.json"

      # PR 本文は信頼できない入力のため、式展開を run に直接埋め込まず env 経由で渡す。
      - name: Check visuals confirmation
        env:
          BASE_LOCKFILE: ${{ runner.temp }}/base-package-lock.json
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/checkVisualsGuard.mjs
