name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Node/npm のバージョンをローカル開発環境（asdf）と一致させる。
      # npm のバージョンが異なると package-lock.json の生成結果が変わり、
      # npm ci が「lock file と不整合」で失敗するため .tool-versions で固定する。
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'

      # package.json と package-lock.json の不整合（依存関係更新時のlockファイル壊れ等）を
      # main への通常push/PR時点で検知するための工程。
      # deploy.yml はタグpush時のみ実行されるため、ここで先行検証する。
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # ライブラリビルド（tsdown）は prepack 経由で npm publish 時にしか実行されず、
      # publish.yml は `v*.*.*` タグのpush時のみ起動するため、このstepがないと
      # ライブラリビルドの破壊をリリースタグを打つまで検知できない。
      # tsdown（clean: true）と vite（emptyOutDir: true）はいずれも dist/ へ出力するため
      # 後発が先発の成果物を削除するが、このjobは成果物を後続で利用しないため問題ない。
      # tsdown の方が軽く早く失敗するため vite ビルドより前に配置する。
      - name: Build library
        run: npm run build:lib

      - name: Build project
        run: npm run build
