# jpmap_terrain デモサイト配信用 Nginx 設定。
#
# spec/demos.md「静的CDNへのデプロイ」節の Nginx 設定例と同一（Docker上で
# 実際に nginx:alpine + dist/ を起動して動作検証済み）。
#
# デモ識別子付きパス（例: /viewer, /viewer/@35.68,139.76）を実体 HTML
# （/viewer.html）へ書き換える。これは vite.rewrites.ts の
# demoAtPathRewrites と同じデモ名一覧に対応させている。
# デモを追加/削除した場合は、この一覧も合わせて更新すること
# （静的設定ファイルのため自動生成されない）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # ※ location の正規表現キャプチャ（外側の $1）を rewrite 側で
        #   そのまま参照すると空になるケースがあるため、rewrite 自体に
        #   捕捉グループを持たせている（location / 直下にまとめて置く）。
        rewrite ^/(viewer|timelapse|polygon|distance|circle|plan|gpx|model|avatar|avatar-controller|boids|flight|artillery|geospatial|zoomloop|roiorbit)(?:/.*)?$ /$1.html last;
        try_files $uri $uri/ =404;
    }
}
